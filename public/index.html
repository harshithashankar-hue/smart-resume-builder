<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PulseChat — Real-Time Chat</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="screen">
  <div class="auth-card">
    <h1>💬 PulseChat</h1>
    <p class="subtitle">Real-time chat, built with Socket.IO</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="text" id="login-username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit">Log In</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <input type="text" id="register-username" placeholder="Choose a username" required />
      <input type="password" id="register-password" placeholder="Choose a password (6+ chars)" required />
      <button type="submit">Create Account</button>
    </form>

    <p id="auth-error" class="error hidden"></p>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen" class="screen hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span id="me-username" class="me"></span>
      <button id="logout-btn" title="Log out">⏻</button>
    </div>

    <div class="sidebar-section">
      <h3>Rooms</h3>
      <ul id="room-list" class="list"></ul>
    </div>

    <div class="sidebar-section">
      <h3>Online (<span id="online-count">0</span>)</h3>
      <ul id="online-list" class="list"></ul>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <span id="current-target">#general</span>
      <span id="typing-indicator" class="typing"></span>
    </header>

    <div id="messages" class="messages"></div>

    <form id="message-form" class="message-form">
      <input type="text" id="message-input" placeholder="Type a message…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
